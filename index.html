<head>

<style>
:root{--bg:#f7fbfe;--panel:#fff;--ink:#1f2937;--muted:#64748b;--line:#dbeaf4;--accent:#bfe6f8;--accent2:#eaf7fd;--danger:#b91c1c;--ok:#0f766e;--shadow:0 12px 35px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:column}.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{margin:0;font-size:20px}.brand small{color:var(--muted)}.actions,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 13px;border-radius:12px}.btn:hover{background:var(--accent2)}.btn.primary{background:var(--accent);border-color:#9fd8ef}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed}.layout{display:grid;grid-template-columns:250px 1fr;gap:18px;padding:18px;flex:1}.sidebar{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;height:fit-content;position:sticky;top:86px}.nav{width:100%;text-align:left;border:0;background:transparent;border-radius:11px;padding:11px 12px;margin:2px 0}.nav.active,.nav:hover{background:var(--accent2)}.content{min-width:0}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}.card h2,.card h3{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{border:1px solid #cfe1ec;border-radius:11px;padding:10px 11px;width:100%;background:#fff;color:var(--ink)}textarea{min-height:95px;resize:vertical;width:100%;display:block}.comment-editor{min-height:320px!important;width:100%;font-size:17px;line-height:1.65;padding:16px!important;border-radius:14px!important}.comment-card{padding:20px}.comment-card h3{margin-bottom:12px}.muted{color:var(--muted);font-size:13px}.small{font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:999px}.tab.active{background:var(--accent)}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.empty{padding:20px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}.list{display:flex;flex-direction:column;gap:8px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.meta{font-size:12px;color:var(--muted)}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:var(--accent2);font-size:12px}.student-grid{display:grid;grid-template-columns:290px 1fr;gap:16px}.student-card{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;background:#fff}.student-card.active{background:var(--accent2);border-color:#9fd8ef}.comment-box{border:1px solid var(--line);background:#fbfdff;border-radius:14px;padding:14px;white-space:pre-wrap;line-height:1.55}.footer{padding:22px;text-align:center;color:#7c8a98;font-size:12px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:50;box-shadow:var(--shadow)}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.38);display:flex;align-items:center;justify-content:center;padding:18px;z-index:40}.modal{background:#fff;border-radius:18px;box-shadow:var(--shadow);width:min(560px,100%);padding:20px;max-height:90vh;overflow:auto}.modal h3{margin-top:0}.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.danger-box{border:1px solid #f3c5c5;background:#fffafa;border-radius:14px;padding:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.preview{border:1px dashed #9ecde3;border-radius:12px;padding:12px;max-height:220px;overflow:auto}.notice{padding:10px 12px;border-radius:12px;background:#fff8db;border:1px solid #f3df8f;color:#6d5900;margin-bottom:14px}.success{color:var(--ok)}.demo-banner{border:1px solid #9fd8ef;background:#eef9fe;border-radius:16px;padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.demo-banner strong{display:block;margin-bottom:3px}.btn.demo-delete{border-color:#efb4b4;color:#991b1b;background:#fff}.btn.demo-delete:hover{background:#fff1f1}
@media(max-width:900px){.layout{grid-template-columns:1fr;padding:12px}.sidebar{position:static;display:flex;gap:6px;overflow:auto}.nav{width:auto;white-space:nowrap}.student-grid,.grid,.grid3{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.item{align-items:flex-start;flex-direction:column}.table thead{display:none}.table,.table tbody,.table tr,.table td{display:block;width:100%}.table tr{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:10px}.table td{border:0;padding:6px 0}.table td:before{content:attr(data-label);display:block;font-size:12px;font-weight:700;color:var(--muted)}}

.group-list{display:flex;flex-direction:column;gap:14px}.group-comment-card{margin-bottom:0}.group-comment-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:12px}.group-comment-head>div:first-child{min-width:180px}.group-number{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#e7f5fb;margin-right:8px;font-weight:700;color:#24435a}.group-comment-editor{width:100%;min-height:150px;font-size:16px;line-height:1.55;resize:vertical}.group-comment-card .row{justify-content:flex-end}@media(max-width:760px){.group-comment-head{flex-direction:column}.group-comment-head .row{width:100%;justify-content:flex-start}.group-comment-editor{min-height:190px}}
</style>

<body>
<div class="app">
<header class="topbar"><div class="brand"><h1>MIS COMENTARIOS DOCENTES</h1><small>Comentarios de boletín con continuidad y estilo propio</small></div><div class="actions" id="topActions"><button class="btn" data-action="undo" id="undoBtn">DESHACER</button><button class="btn" data-action="backup">EXPORTAR DATOS</button><label class="btn" for="importFile">IMPORTAR DATOS</label><input class="hidden" id="importFile" type="file" accept=".json,application/json"></div></header>

<div class="toast" id="toast"></div><div id="modalRoot"></div>
<script>
(()=>{
'use strict';
const KEY='heymisskite_mis_comentarios_docentes_v5';
const DEMO_DISMISSED_KEY='heymisskite_mis_comentarios_docentes_demo_dismissed_v5';
const profileBase={language:'Español',person:'Segunda persona',tone:'Cálido',formality:'Profesional',length:'Media',customLength:'',preferred:'',avoid:'',institutional:'',opening:'',closing:'',learned:''};
const initial=()=>({version:5,demoMode:false,teacher:{name:'',year:String(new Date().getFullYear()),subject:''},schools:[],undo:null,ui:{view:'inicio',schoolId:null,courseId:null,periodId:null,studentId:null}});
function demoState(){
  const sc='school_demo',c='course_demo',p1='period_demo_1',p2='period_demo_2',p3='period_demo_3';
  const students=[
    {id:'student_demo_1',name:'Emma Collins'},
    {id:'student_demo_2',name:'Lucas Bennett'},
    {id:'student_demo_3',name:'Olivia Parker'},
    {id:'student_demo_4',name:'Sophie Taylor'},
    {id:'student_demo_5',name:'Martina Suárez'},
    {id:'student_demo_6',name:'Benjamín Castro'}
  ];
  const periodData={};
  periodData[p1]={
    student_demo_1:{performance:'Muy bueno',participation:'Activa',autonomy:'Autónomo/a',progress:'Progreso sostenido',strengths:'lectura y comprensión de consignas',workOn:'ganar confianza al hablar frente al grupo',achievements:'mejoró la fluidez lectora',notes:'',comment:'Emma comenzó el año con una actitud muy comprometida y fue construyendo una base sólida en lectura y comprensión. Participa con interés y trabaja de manera cada vez más autónoma; el próximo paso será animarse a intervenir con más confianza en situaciones orales.',manual:false},
    student_demo_2:{performance:'Bueno',participation:'Variable',autonomy:'En desarrollo',progress:'Progreso gradual',strengths:'creatividad y buena disposición para aprender',workOn:'organización y constancia en las tareas',achievements:'logró completar actividades con mayor independencia',notes:'',comment:'Lucas mostró buenas ideas y mucha creatividad durante este primer período. Cuando logra organizarse y sostener la atención, resuelve las propuestas con buenos resultados; seguir fortaleciendo sus rutinas de trabajo le permitirá aprovechar mejor todo su potencial.',manual:false},
    student_demo_3:{performance:'Excelente',participation:'Muy activa',autonomy:'Muy autónomo/a',progress:'Mucho progreso',strengths:'producción escrita y participación oral',workOn:'revisar sus producciones antes de entregarlas',achievements:'amplió su vocabulario y participa con seguridad',notes:'',comment:'Olivia tuvo un comienzo de año excelente. Se expresa con seguridad, participa activamente y demuestra un manejo muy sólido de los contenidos; incorporar una revisión final más sistemática de sus producciones puede ayudarla a seguir refinando un trabajo que ya es muy bueno.',manual:false},
    student_demo_4:{performance:'Muy bueno',participation:'Activa',autonomy:'Autónomo/a',progress:'Progreso sostenido',strengths:'trabajo colaborativo y escucha',workOn:'atreverse a tomar más iniciativa',achievements:'se integró muy bien al trabajo grupal',notes:'',comment:'Sophie se integró muy bien al grupo y se destacó especialmente por su capacidad para escuchar, colaborar y acompañar a sus compañeros. A medida que gane confianza para tomar más iniciativa, podrá mostrar todavía más todo lo que sabe.',manual:false},
    student_demo_5:{performance:'Bueno',participation:'Activa',autonomy:'En desarrollo',progress:'Progreso gradual',strengths:'esfuerzo y perseverancia',workOn:'comprensión de textos más extensos',achievements:'mejoró en la resolución de consignas',notes:'',comment:'Martina sostuvo un trabajo muy perseverante durante el período y eso se reflejó en una mejora clara al resolver consignas. Continúa construyendo estrategias para comprender textos más extensos y es importante que siga confiando en ese proceso.',manual:false},
    student_demo_6:{performance:'Muy bueno',participation:'Muy activa',autonomy:'Autónomo/a',progress:'Progreso sostenido',strengths:'participación oral y vocabulario',workOn:'organizar mejor sus ideas por escrito',achievements:'incorporó vocabulario nuevo con facilidad',notes:'',comment:'Benjamín participa con entusiasmo y suele incorporar vocabulario nuevo con mucha facilidad. Su oralidad es una fortaleza clara; durante los próximos meses el foco estará en trasladar esa riqueza de ideas a producciones escritas cada vez más organizadas.',manual:false}
  };
  periodData[p2]={
    student_demo_1:{performance:'Excelente',participation:'Muy activa',autonomy:'Autónomo/a',progress:'Mucho progreso',strengths:'lectura, comprensión y participación oral',workOn:'seguir ampliando vocabulario',achievements:'ahora participa espontáneamente en intercambios orales',notes:'',comment:'El progreso de Emma durante este segundo período fue muy claro: además de sostener un excelente desempeño en lectura y comprensión, comenzó a participar espontáneamente en los intercambios orales. Esa mayor confianza muestra cuánto creció desde el inicio del año y ahora puede concentrarse en seguir ampliando su vocabulario.',manual:false},
    student_demo_2:{performance:'Muy bueno',participation:'Activa',autonomy:'En desarrollo',progress:'Progreso sostenido',strengths:'creatividad y resolución de problemas',workOn:'mantener una rutina de trabajo más estable',achievements:'mejoró su organización y completa más tareas a tiempo',notes:'',comment:'Lucas logró avances importantes en organización y hoy completa sus tareas con mucha más regularidad. Su creatividad sigue siendo una de sus mayores fortalezas y, cuando sostiene una rutina de trabajo estable, puede resolver propuestas complejas con muy buenos resultados.',manual:false},
    student_demo_3:{performance:'Excelente',participation:'Muy activa',autonomy:'Muy autónomo/a',progress:'Progreso sostenido',strengths:'producción escrita, oralidad y autonomía',workOn:'profundizar la revisión de detalles',achievements:'produce textos más ricos y precisos',notes:'',comment:'Olivia mantuvo un desempeño excelente y sus producciones escritas son cada vez más ricas y precisas. Trabaja con mucha autonomía y aprovecha el feedback; seguir revisando con atención los pequeños detalles le permitirá alcanzar un nivel de precisión todavía mayor.',manual:false},
    student_demo_4:{performance:'Muy bueno',participation:'Muy activa',autonomy:'Autónomo/a',progress:'Mucho progreso',strengths:'colaboración, participación y confianza',workOn:'sostener esta iniciativa en tareas individuales',achievements:'comenzó a tomar la palabra y proponer ideas',notes:'',comment:'Sophie dio un paso importante en confianza durante este período: empezó a tomar la palabra con mayor frecuencia y a proponer sus propias ideas, además de mantener su excelente disposición para el trabajo colaborativo. El desafío ahora es sostener esa misma iniciativa cuando trabaja de manera individual.',manual:false},
    student_demo_5:{performance:'Muy bueno',participation:'Activa',autonomy:'Autónomo/a',progress:'Mucho progreso',strengths:'comprensión y perseverancia',workOn:'explicar con mayor detalle sus respuestas',achievements:'comprende textos más largos con mayor seguridad',notes:'',comment:'Martina mostró un crecimiento muy significativo en comprensión y hoy aborda textos más extensos con mucha más seguridad. Su perseverancia fue clave para este avance; el próximo objetivo será desarrollar respuestas más completas y explicar con mayor detalle cómo llegó a sus conclusiones.',manual:false},
    student_demo_6:{performance:'Muy bueno',participation:'Muy activa',autonomy:'Autónomo/a',progress:'Progreso sostenido',strengths:'vocabulario, oralidad y creatividad',workOn:'organización de la escritura',achievements:'sus textos tienen más contenido y mejor estructura',notes:'',comment:'Benjamín siguió enriqueciendo su vocabulario y empezó a trasladar mejor sus ideas al papel. Sus textos tienen ahora más contenido y una estructura más clara, aunque todavía puede beneficiarse de planificar antes de escribir para organizar sus ideas con mayor precisión.',manual:false}
  };
  periodData[p3]={};
  students.forEach((st,i)=>{periodData[p3][st.id]={performance:['Excelente','Muy bueno','Excelente','Muy bueno','Muy bueno','Muy bueno'][i],participation:['Muy activa','Activa','Muy activa','Muy activa','Activa','Muy activa'][i],autonomy:['Muy autónomo/a','Autónomo/a','Muy autónomo/a','Autónomo/a','Autónomo/a','Autónomo/a'][i],progress:['Progreso sostenido','Mucho progreso','Progreso sostenido','Mucho progreso','Mucho progreso','Progreso sostenido'][i],strengths:['lectura, oralidad y confianza','creatividad y mayor organización','producción escrita y autonomía','participación y trabajo colaborativo','comprensión y perseverancia','vocabulario y participación oral'][i],workOn:['seguir ampliando vocabulario','sostener la organización de forma independiente','revisar detalles finales','mantener iniciativa en tareas individuales','desarrollar respuestas más completas','planificar antes de escribir'][i],achievements:['participa con mucha seguridad y sostiene un excelente desempeño','logró trabajar con mayor constancia','produce textos cada vez más precisos','se anima a proponer ideas con confianza','comprende textos extensos con seguridad','organiza mejor sus producciones escritas'][i],notes:'Datos de prueba para explorar la app.',comment:'',manual:false}});
  return {version:5,demoMode:true,teacher:{name:'Docente de prueba',year:'2026',subject:'Inglés'},schools:[{id:sc,name:'Colegio Demo',profile:{...profileBase,language:'Español',person:'Segunda persona',tone:'Cálido',formality:'Profesional',length:'Media',preferred:'progreso, confianza, autonomía',avoid:'frases genéricas o demasiado formales',institutional:'Mantener un tono cercano, claro y respetuoso.',opening:'',closing:''},courses:[{id:c,name:'3.º A',level:'Primer ciclo de primaria',subject:'Inglés',periods:[{id:p1,name:'1.er trimestre'},{id:p2,name:'2.º trimestre'},{id:p3,name:'3.er trimestre'}],students,periodData,profileOverrideEnabled:false,profileOverride:{...profileBase}}]}],undo:null,ui:{view:'inicio',schoolId:sc,courseId:c,periodId:p3,studentId:students[0].id}};
}
let storageOK=true;
let state=load();
function uid(p){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function clone(v){return JSON.parse(JSON.stringify(v))}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){try{const raw=localStorage.getItem(KEY);if(raw)return normalize(JSON.parse(raw));const dismissed=localStorage.getItem(DEMO_DISMISSED_KEY)==='1';const fresh=dismissed?initial():demoState();localStorage.setItem(KEY,JSON.stringify(fresh));return normalize(fresh)}catch(e){storageOK=false;return demoState()}}
function normalize(x){const s={...initial(),...x};s.demoMode=!!x.demoMode;s.teacher={...initial().teacher,...(x.teacher||{})};s.ui={...initial().ui,...(x.ui||{})};s.schools=Array.isArray(x.schools)?x.schools:[];s.schools.forEach(sc=>{sc.profile={...profileBase,...(sc.profile||{})};sc.courses=Array.isArray(sc.courses)?sc.courses:[];sc.courses.forEach(c=>{c.periods=Array.isArray(c.periods)?c.periods:[];c.students=Array.isArray(c.students)?c.students:[];c.periodData=c.periodData||{};c.profileOverride={...profileBase,...(c.profileOverride||sc.profile)};c.profileOverrideEnabled=!!c.profileOverrideEnabled})});return s}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false}updateUndo()}
function snap(label){state.undo={label,previous:clone({...state,undo:null})}}
function undo(){if(!state.undo)return;state=normalize(clone(state.undo.previous));state.undo=null;save();render();toast('Cambio deshecho')}
function updateUndo(){const b=document.getElementById('undoBtn');if(b)b.disabled=!state.undo}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display='none',2200)}
function school(){return state.schools.find(x=>x.id===state.ui.schoolId)||state.schools[0]||null}
function course(){const s=school();return s?.courses.find(x=>x.id===state.ui.courseId)||s?.courses[0]||null}
function period(){const c=course();return c?.periods.find(x=>x.id===state.ui.periodId)||c?.periods[0]||null}
function student(){const c=course();return c?.students.find(x=>x.id===state.ui.studentId)||c?.students[0]||null}
function ensureSelection(){const s=school();state.ui.schoolId=s?.id||null;const c=course();state.ui.courseId=c?.id||null;const p=period();state.ui.periodId=p?.id||null;const st=student();state.ui.studentId=st?.id||null}
function pdata(c,studentId,periodId){c.periodData ||= {};c.periodData[periodId] ||= {};c.periodData[periodId][studentId] ||= {performance:'',participation:'',autonomy:'',progress:'',strengths:'',workOn:'',achievements:'',notes:'',comment:'',manual:false};return c.periodData[periodId][studentId]}
function opts(arr,val){return arr.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${esc(x||'—')}</option>`).join('')}
function sidebar(){const items=[['inicio','Inicio'],['estructura','Escuelas y cursos'],['alumnos','Alumnos'],['estilo','Perfil de escritura'],['comentarios','Comentarios'],['grupo','Vista del grupo'],['trayectoria','Vista por alumno'],['exportar','Exportar']];return items.map(([v,l])=>`<button class="nav ${state.ui.view===v?'active':''}" data-action="nav" data-view="${v}">${l}</button>`).join('')}
function render(){ensureSelection();document.getElementById('sidebar').innerHTML=sidebar();const map={inicio:home,estructura:structure,alumnos:studentsView,estilo:styleView,comentarios:commentsView,grupo:groupView,trayectoria:trajectoryView,exportar:exportView};document.getElementById('content').innerHTML=(map[state.ui.view]||home)();const a=document.getElementById('topActions');const oldDemo=document.getElementById('demoDeleteBtn');if(oldDemo)oldDemo.remove();if(state.demoMode&&a){const b=document.createElement('button');b.className='btn demo-delete';b.id='demoDeleteBtn';b.dataset.action='delete-demo';b.textContent='ELIMINAR DATOS DE PRUEBA';a.prepend(b)}updateUndo()}
function home(){return `${!storageOK?'<div class="notice">Tu navegador está bloqueando el guardado local. Abrí este archivo en Chrome, Edge, Safari o Firefox normal para conservar los datos.</div>':''}${state.demoMode?'<div class="demo-banner"><div><strong>Estás viendo datos de prueba</strong><span class="muted">Ya hay una escuela, un curso, períodos, alumnos y comentarios cargados para que pruebes toda la app sin preparar nada.</span></div><button class="btn demo-delete" data-action="delete-demo">ELIMINAR DATOS DE PRUEBA Y EMPEZAR</button></div>':''}<div class="card"><h2>Datos generales</h2><div class="grid3"><div class="field"><label>Nombre del docente</label><input data-bind="teacher.name" value="${esc(state.teacher.name)}"></div><div class="field"><label>Ciclo lectivo</label><input data-bind="teacher.year" value="${esc(state.teacher.year)}"></div><div class="field"><label>Materia / área</label><input data-bind="teacher.subject" value="${esc(state.teacher.subject)}"></div></div></div><div class="card"><h3>Cómo está organizada</h3><p>Docente → Escuela → Curso → Alumno. El alumno pertenece al curso y aparece automáticamente en todos sus períodos.</p><p class="muted">Los cambios se guardan automáticamente en este dispositivo.</p></div>`}
function structure(){const s=school(),c=course();return `<div class="card"><div class="section-title"><h2>Escuelas</h2><button class="btn primary" data-action="open-school">+ Escuela</button></div>${state.schools.length?`<div class="tabs">${state.schools.map(x=>`<button class="tab ${s?.id===x.id?'active':''}" data-action="select-school" data-id="${x.id}">${esc(x.name)}</button>`).join('')}</div>`:'<div class="empty">Todavía no agregaste escuelas.</div>'}${s?`<div class="row" style="margin-top:12px"><button class="btn" data-action="open-school" data-edit="${s.id}">Editar escuela</button><button class="btn danger" data-action="confirm-delete" data-kind="school" data-id="${s.id}">Eliminar escuela</button></div>`:''}</div>${s?`<div class="card"><div class="section-title"><h2>Cursos de ${esc(s.name)}</h2><button class="btn primary" data-action="open-course">+ Curso</button></div>${s.courses.length?`<div class="tabs">${s.courses.map(x=>`<button class="tab ${c?.id===x.id?'active':''}" data-action="select-course" data-id="${x.id}">${esc(x.name)}</button>`).join('')}</div>`:'<div class="empty">Todavía no agregaste cursos.</div>'}${c?`<div class="row" style="margin-top:12px"><span class="pill">${esc(c.level)}</span><span class="muted">${esc(c.subject||state.teacher.subject||'Sin materia definida')}</span><button class="btn" data-action="open-course" data-edit="${c.id}">Editar</button><button class="btn danger" data-action="confirm-delete" data-kind="course" data-id="${c.id}">Eliminar</button></div>`:''}</div>`:''}${c?periodsCard(c):''}`}
function periodsCard(c){return `<div class="card"><div class="section-title"><h2>Períodos</h2><button class="btn primary" data-action="open-period">+ Período</button></div>${c.periods.length?`<div class="list">${c.periods.map((p,i)=>`<div class="item"><div><strong>${esc(p.name)}</strong><div class="meta">Orden ${i+1}</div></div><div class="row"><button class="btn" data-action="move-period" data-id="${p.id}" data-dir="-1" ${i===0?'disabled':''}>↑</button><button class="btn" data-action="move-period" data-id="${p.id}" data-dir="1" ${i===c.periods.length-1?'disabled':''}>↓</button><button class="btn" data-action="open-period" data-edit="${p.id}">Editar</button><button class="btn danger" data-action="confirm-delete" data-kind="period" data-id="${p.id}">Eliminar</button></div></div>`).join('')}</div>`:'<div class="empty">Todavía no hay períodos.</div>'}</div>`}
function studentsView(){const c=course();if(!c)return `<div class="card"><div class="empty">Primero creá una escuela y un curso.</div></div>`;return `<div class="card"><h2>Alumnos · ${esc(c.name)}</h2><div class="grid"><div><h3>Agregar uno</h3><div class="field"><label>Nombre y apellido</label><input id="singleStudent" placeholder="Ej. Emma Collins"></div><div class="row" style="margin-top:8px"><button class="btn primary" data-action="add-student">AGREGAR ALUMNO</button></div></div><div><h3>Pegar lista</h3><textarea id="bulkStudents" placeholder="Pegá un alumno por línea"></textarea><div class="row"><button class="btn" data-action="preview-bulk">Detectar alumnos</button></div><div id="bulkPreview"></div></div></div></div><div class="card"><h3>Lista del curso</h3>${c.students.length?`<div class="list">${c.students.map(st=>`<div class="item"><strong>${esc(st.name)}</strong><div class="row"><button class="btn" data-action="open-student" data-edit="${st.id}">Editar</button><button class="btn danger" data-action="confirm-delete" data-kind="student" data-id="${st.id}">Eliminar</button></div></div>`).join('')}</div>`:'<div class="empty">Todavía no cargaste alumnos.</div>'}</div>`}
function styleView(){const s=school(),c=course();if(!s)return `<div class="card"><div class="empty">Primero creá una escuela.</div></div>`;const p=c?.profileOverrideEnabled?c.profileOverride:s.profile;return `<div class="card"><h2>Perfil de escritura · ${esc(s.name)}</h2>${c?`<label><input type="checkbox" data-action="toggle-override" ${c.profileOverrideEnabled?'checked':''}> Usar configuración diferente para este curso</label>`:''}<div class="grid3" style="margin-top:14px"><div class="field"><label>Idioma</label><select data-profile="language">${opts(['Español','Inglés'],p.language)}</select></div><div class="field"><label>Persona</label><select data-profile="person">${opts(['Primera persona','Segunda persona','Tercera persona'],p.person)}</select></div><div class="field"><label>Tono</label><select data-profile="tone">${opts(['Muy cálido','Cálido','Neutro','Formal'],p.tone)}</select></div><div class="field"><label>Formalidad</label><select data-profile="formality">${opts(['Cercana','Profesional','Institucional'],p.formality)}</select></div><div class="field"><label>Extensión</label><select data-profile="length">${opts(['Breve','Media','Extensa','Personalizada'],p.length)}</select></div><div class="field"><label>Máximo aprox.</label><input data-profile="customLength" value="${esc(p.customLength)}"></div></div><div class="grid" style="margin-top:14px"><div class="field"><label>Expresiones preferidas</label><textarea data-profile="preferred">${esc(p.preferred)}</textarea></div><div class="field"><label>Expresiones a evitar</label><textarea data-profile="avoid">${esc(p.avoid)}</textarea></div><div class="field"><label>Indicaciones institucionales</label><textarea data-profile="institutional">${esc(p.institutional)}</textarea></div><div class="field"><label>Forma habitual de comenzar</label><textarea data-profile="opening">${esc(p.opening)}</textarea></div><div class="field"><label>Forma habitual de cerrar</label><textarea data-profile="closing">${esc(p.closing)}</textarea></div></div></div><div class="card"><h2>Aprender el estilo de mi escuela</h2><p class="muted">Pegá comentarios anteriores. Se analiza el estilo, no los datos personales.</p><textarea id="styleSamples">${esc(p.learned)}</textarea><div class="row"><button class="btn primary" data-action="analyze-style">ANALIZAR ESTILO</button><label class="btn" for="styleFile">Subir TXT o CSV</label><input class="hidden" id="styleFile" type="file" accept=".txt,.csv,text/plain,text/csv"></div><div id="styleResult"></div></div>`}
function commentsView(){const c=course(),p=period();if(!c||!p)return `<div class="card"><div class="empty">Necesitás un curso con al menos un período.</div></div>`;if(!c.students.length)return `<div class="card"><div class="empty">Cargá alumnos para generar comentarios.</div></div>`;const st=student(),d=pdata(c,st.id,p.id);return `<div class="card"><div class="row"><div class="field" style="min-width:220px"><label>Período</label><select data-action="select-period">${c.periods.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><button class="btn" data-action="generate-all">GENERAR TODOS</button><button class="btn" data-action="review-similar">REVISAR SIMILITUDES</button></div></div><div class="student-grid"><div class="card"><h3>Alumnos</h3>${c.students.map(x=>`<div class="student-card ${x.id===st.id?'active':''}" data-action="select-student" data-id="${x.id}"><strong>${esc(x.name)}</strong><div class="meta">${pdata(c,x.id,p.id).comment?'Comentario listo':'Pendiente'}</div></div>`).join('')}</div><div>${studentEditor(c,p,st,d)}</div></div>`}
function studentEditor(c,p,st,d){const prev=previousPeriod(c,p);return `<div class="card"><h2>${esc(st.name)}</h2>${prev?`<details><summary>VER PERÍODO ANTERIOR</summary><div class="comment-box" style="margin-top:10px">${esc(pdata(c,st.id,prev.id).comment||'Sin comentario anterior.')}</div></details>`:''}<div class="grid3" style="margin-top:14px"><div class="field"><label>Desempeño</label><select data-periodfield="performance">${opts(['','Excelente','Muy bueno','Bueno','En proceso','Personalizado'],d.performance)}</select></div><div class="field"><label>Participación</label><select data-periodfield="participation">${opts(['','Muy activa','Activa','Variable','Necesita acompañamiento','Personalizado'],d.participation)}</select></div><div class="field"><label>Autonomía</label><select data-periodfield="autonomy">${opts(['','Muy autónomo/a','Autónomo/a','En desarrollo','Necesita acompañamiento','Personalizado'],d.autonomy)}</select></div><div class="field"><label>Progreso</label><select data-periodfield="progress">${opts(['','Mucho progreso','Progreso sostenido','Progreso gradual','Continúa en proceso','Personalizado'],d.progress)}</select></div></div><div class="grid" style="margin-top:14px"><div class="field"><label>Fortalezas</label><textarea data-periodfield="strengths">${esc(d.strengths)}</textarea></div><div class="field"><label>Aspectos a seguir trabajando</label><textarea data-periodfield="workOn">${esc(d.workOn)}</textarea></div><div class="field"><label>Logros concretos</label><textarea data-periodfield="achievements">${esc(d.achievements)}</textarea></div><div class="field"><label>Observaciones</label><textarea data-periodfield="notes">${esc(d.notes)}</textarea></div></div><div class="row"><button class="btn primary" data-action="generate-comment">GENERAR COMENTARIO</button><button class="btn" data-action="another-version">OTRA VERSIÓN</button><button class="btn" data-action="shorter">MÁS BREVE</button></div></div><div class="card comment-card"><h3>Comentario</h3><textarea class="comment-editor" id="commentText" data-action="edit-comment" placeholder="El comentario generado aparecerá acá. También podés editarlo directamente.">${esc(d.comment)}</textarea><div class="row"><button class="btn" data-action="copy-comment">COPIAR</button></div><p class="muted">Las ediciones manuales se conservan y se exportan tal como las dejaste.</p></div>`}

function groupView(){const s=school(),c=course(),p=period();if(!s||!c||!p)return `<div class="card"><div class="empty">Necesitás una escuela, un curso y un período.</div></div>`;if(!c.students.length)return `<div class="card"><div class="empty">Todavía no hay alumnos en este curso.</div></div>`;return `<div class="card"><div class="section-title"><div><h2>Vista del grupo · ${esc(c.name)}</h2><p class="muted">Revisá todos los comentarios del período en una sola pantalla.</p></div><div class="field" style="min-width:220px"><label>Período</label><select data-action="select-period">${c.periods.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div></div><div class="row"><button class="btn" data-action="generate-all">GENERAR PENDIENTES</button><button class="btn" data-action="review-similar">REVISAR SIMILITUDES</button><button class="btn" data-action="copy-all">COPIAR TODOS</button></div></div><div class="group-list">${c.students.map((st,i)=>{const d=pdata(c,st.id,p.id);return `<div class="card group-comment-card"><div class="group-comment-head"><div><span class="group-number">${i+1}</span><strong>${esc(st.name)}</strong><div class="meta">${d.comment?'Comentario listo':'Pendiente'}</div></div><div class="row"><button class="btn" data-action="open-student-comment" data-id="${st.id}">VER / EDITAR COMPLETO</button><button class="btn" data-action="copy-group-comment" data-id="${st.id}">COPIAR</button>${d.comment?`<button class="btn" data-action="regenerate-group-comment" data-id="${st.id}">OTRA VERSIÓN</button>`:`<button class="btn primary" data-action="generate-group-comment" data-id="${st.id}">GENERAR</button>`}</div></div><textarea class="group-comment-editor" data-group-comment="${st.id}" placeholder="Todavía no hay comentario para este alumno.">${esc(d.comment)}</textarea></div>`}).join('')}</div>`}
function trajectoryView(){const c=course();if(!c||!c.students.length)return `<div class="card"><div class="empty">Cargá alumnos para ver su trayectoria.</div></div>`;const st=student();const all=c.periods.map(p=>pdata(c,st.id,p.id));const strengths=[...new Set(all.map(x=>x.strengths).filter(Boolean))];const work=[...new Set(all.map(x=>x.workOn).filter(Boolean))];const last=[...all].reverse().find(x=>x.progress)?.progress||'—';return `<div class="card"><div class="field" style="max-width:360px"><label>Alumno</label><select data-action="trajectory-student">${c.students.map(x=>`<option value="${x.id}" ${x.id===st.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div></div><div class="card"><h2>${esc(st.name)} · Trayectoria</h2>${c.periods.map(p=>`<div style="margin-bottom:18px"><strong>${esc(p.name)}</strong><div class="comment-box">${esc(pdata(c,st.id,p.id).comment||'Sin comentario.')}</div></div>`).join('')}</div><div class="card"><h3>SEGUIMIENTO</h3><p><strong>Fortalezas registradas:</strong> ${esc(strengths.join(' · ')||'—')}</p><p><strong>Aspectos en seguimiento:</strong> ${esc(work.join(' · ')||'—')}</p><p><strong>Último progreso registrado:</strong> ${esc(last)}</p></div>`}
function exportView(){const s=school(),c=course(),p=period();if(!s||!c||!p)return `<div class="card"><div class="empty">Primero completá escuelas, cursos y períodos.</div></div>`;return `<div class="card"><h2>Exportar comentarios</h2><p class="muted">Elegí el formato que ya usás. No necesitás convertir archivos después.</p><div class="row"><button class="btn primary" data-action="export-docx">WORD / GOOGLE DOCS (.DOCX)</button><button class="btn" data-action="export-xlsx">EXCEL / GOOGLE SHEETS (.XLSX)</button><button class="btn" data-action="copy-all">COPIAR TODOS</button></div><p class="small muted">Word y Excel descargan archivos editables. Los archivos DOCX y XLSX también se pueden subir directamente a Google Drive.</p></div><div class="card"><h3>Vista previa · ${esc(p.name)}</h3><div class="table-wrap"><table class="table"><thead><tr><th>Alumno</th><th>Comentario</th></tr></thead><tbody>${c.students.map(st=>`<tr><td data-label="Alumno">${esc(st.name)}</td><td data-label="Comentario">${esc(pdata(c,st.id,p.id).comment)}</td></tr>`).join('')}</tbody></table></div></div>`}
function openModal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" data-action="close-modal"><div class="modal" data-modal-inner>${html}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function schoolModal(id){const s=state.schools.find(x=>x.id===id);openModal(`<h3>${s?'Editar':'Agregar'} escuela</h3><div class="field"><label>Nombre de la escuela</label><input id="modalSchoolName" value="${esc(s?.name||'')}" autofocus></div><div class="modal-footer"><button class="btn" data-action="close-modal">CANCELAR</button><button class="btn primary" data-action="save-school" data-id="${s?.id||''}">GUARDAR</button></div>`)}
function courseModal(id){const s=school(),c=s?.courses.find(x=>x.id===id);openModal(`<h3>${c?'Editar':'Agregar'} curso</h3><div class="grid"><div class="field"><label>Nombre / grado / año</label><input id="modalCourseName" value="${esc(c?.name||'')}"></div><div class="field"><label>Nivel educativo</label><select id="modalCourseLevel">${opts(['Nivel Inicial / Kinder','Primer ciclo de primaria','Segundo ciclo de primaria','Secundaria'],c?.level||'Primer ciclo de primaria')}</select></div><div class="field"><label>Materia / área</label><input id="modalCourseSubject" value="${esc(c?.subject||state.teacher.subject||'')}"></div>${c?'':`<div class="field"><label>Organización inicial</label><select id="modalPeriodType">${opts(['Bimestres','Trimestres','Cuatrimestres','Semestres','Personalizado'],'Trimestres')}</select></div>`}</div><div class="modal-footer"><button class="btn" data-action="close-modal">CANCELAR</button><button class="btn primary" data-action="save-course" data-id="${c?.id||''}">GUARDAR</button></div>`)}
function periodModal(id){const c=course(),p=c?.periods.find(x=>x.id===id);openModal(`<h3>${p?'Editar':'Agregar'} período</h3><div class="field"><label>Nombre del período</label><input id="modalPeriodName" value="${esc(p?.name||'')}"></div><div class="modal-footer"><button class="btn" data-action="close-modal">CANCELAR</button><button class="btn primary" data-action="save-period" data-id="${p?.id||''}">GUARDAR</button></div>`)}
function studentModal(id){const c=course(),st=c?.students.find(x=>x.id===id);openModal(`<h3>Editar alumno</h3><div class="field"><label>Nombre y apellido</label><input id="modalStudentName" value="${esc(st?.name||'')}"></div><div class="modal-footer"><button class="btn" data-action="close-modal">CANCELAR</button><button class="btn primary" data-action="save-student" data-id="${st?.id||''}">GUARDAR</button></div>`)}
function deleteDemoModal(){openModal(`<h3>Eliminar datos de prueba</h3><div class="danger-box"><strong>¿Querés borrar todos los datos de prueba?</strong><p style="margin-bottom:0">La app va a quedar vacía para que cargues tus escuelas, cursos y alumnos reales. Los datos de prueba no volverán a aparecer al recargar.</p></div><div class="modal-footer"><button class="btn" data-action="close-modal">CANCELAR</button><button class="btn danger" data-action="delete-demo-confirmed">ELIMINAR Y EMPEZAR</button></div>`)}
function deleteModal(kind,id){const s=school(),c=course();let title='Eliminar elemento',text='Esta acción eliminará la información asociada.';if(kind==='school'){const x=state.schools.find(a=>a.id===id);title=`Eliminar ${x?.name||'escuela'}`;text='También se eliminarán sus cursos, alumnos, períodos y comentarios.'}if(kind==='course'){const x=s?.courses.find(a=>a.id===id);title=`Eliminar ${x?.name||'curso'}`;text='También se eliminarán sus períodos, alumnos y comentarios.'}if(kind==='period'){const x=c?.periods.find(a=>a.id===id);title=`Eliminar ${x?.name||'período'}`;text='Se eliminarán únicamente los datos y comentarios de este período.'}if(kind==='student'){const x=c?.students.find(a=>a.id===id);title=`Eliminar ${x?.name||'alumno'}`;text='Se eliminarán sus datos y comentarios del curso.'}openModal(`<h3>${esc(title)}</h3><div class="danger-box">${esc(text)}</div><div class="modal-footer"><button class="btn" data-action="close-modal">CANCELAR</button><button class="btn danger" data-action="delete-confirmed" data-kind="${kind}" data-id="${id}">ELIMINAR</button></div>`)}
function makePeriods(type){const map={Bimestres:4,Trimestres:3,Cuatrimestres:2,Semestres:2};if(type==='Personalizado')return[];const n=map[type]||0;const single={Bimestres:'bimestre',Trimestres:'trimestre',Cuatrimestres:'cuatrimestre',Semestres:'semestre'}[type]||'período';return Array.from({length:n},(_,i)=>({id:uid('period'),name:`${i+1}.º ${single}`}))}
function parseNames(txt,c){const existing=new Set(c.students.map(x=>x.name.trim().toLocaleLowerCase('es'))),seen=new Set();return txt.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').map(x=>x.replace(/\t+/g,' ').trim()).filter(Boolean).filter(n=>{const k=n.toLocaleLowerCase('es');if(existing.has(k)||seen.has(k))return false;seen.add(k);return true})}
function previousPeriod(c,p){const i=c.periods.findIndex(x=>x.id===p.id);return i>0?c.periods[i-1]:null}
function prof(c){const s=school();return c.profileOverrideEnabled?c.profileOverride:s.profile}
function generateComment(c,p,st,d,v=0){const pr=prof(c),prev=previousPeriod(c,p),pd=prev?pdata(c,st.id,prev.id):null,final=c.periods.findIndex(x=>x.id===p.id)===c.periods.length-1;return pr.language==='Inglés'?genEN(c,st,d,pd,pr,v,final):genES(c,st,d,pd,pr,v,final)}
function genES(c,st,d,pd,pr,v,final){const name=st.name.split(/\s+/)[0],open=[`${name}, a lo largo de este período`,`${name}, durante este período`,`${name}, en este tramo del año`,`${name}, en estas últimas semanas`][v%4],parts=[];const perf={Excelente:'tu desempeño fue excelente','Muy bueno':'mostraste un desempeño muy bueno',Bueno:'sostuviste un buen desempeño','En proceso':'continuás construyendo tus aprendizajes'}[d.performance]||'';const part={'Muy activa':'participaste con mucha iniciativa',Activa:'participaste de manera activa',Variable:'tu participación fue variable','Necesita acompañamiento':'todavía necesitás acompañamiento para participar con mayor seguridad'}[d.participation]||'';const aut={'Muy autónomo/a':'trabajaste con mucha autonomía','Autónomo/a':'te manejaste con autonomía','En desarrollo':'seguís desarrollando tu autonomía','Necesita acompañamiento':'todavía necesitás acompañamiento para organizar tu trabajo con mayor independencia'}[d.autonomy]||'';const prog={'Mucho progreso':'se notó un avance muy marcado','Progreso sostenido':'mantuviste un progreso sostenido','Progreso gradual':'fuiste avanzando de manera gradual','Continúa en proceso':'hay aprendizajes que continúan en proceso'}[d.progress]||'';const first=[perf,part,aut].filter(Boolean);if(first.length)parts.push(`${open}, ${joinES(first)}.`);if(d.strengths)parts.push(`Entre tus fortalezas se destacan ${low(d.strengths)}.`);if(d.achievements)parts.push(`También lograste ${low(d.achievements)}.`);if(prog)parts.push(`${cap(prog)}${pd?.progress?', dando continuidad al trabajo del período anterior':''}.`);if(d.workOn)parts.push(`De cara al próximo período, será importante seguir trabajando en ${low(d.workOn)}.`);if(d.notes)parts.push(`${cap(clean(d.notes))}.`);if(final&&parts.length)parts.push(c.level.includes('Primer')||c.level.includes('Kinder')?'Fue muy lindo acompañar tu recorrido durante el año.':'Este cierre permite reconocer el recorrido realizado y proyectar nuevos objetivos con mayor document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='close-modal'&&e.target.closest('[data-modal-inner]')&&!e.target.matches('[data-action="close-modal"]'))return;if(a==='nav'){state.ui.view=el.dataset.view;save();render()}else if(a==='undo')undo();else if(a==='backup')backup();else if(a==='delete-demo')deleteDemoModal();else if(a==='delete-demo-confirmed'){try{localStorage.setItem(DEMO_DISMISSED_KEY,'1')}catch(err){}state=initial();state.ui.view='inicio';save();closeModal();render();toast('Datos de prueba eliminados. Ya podés empezar con los tuyos.')}else if(a==='open-school')schoolModal(el.dataset.edit);else if(a==='open-course')courseModal(el.dataset.edit);else if(a==='open-period')periodModal(el.dataset.edit);else if(a==='open-student')studentModal(el.dataset.edit);else if(a==='close-modal')closeModal();else if(a==='save-school'){const name=document.getElementById('modalSchoolName').value.trim();if(!name)return toast('Escribí el nombre de la escuela');const id=el.dataset.id;if(id){const s=state.schools.find(x=>x.id===id);snap('Editar escuela');s.name=name}else{snap('Agregar escuela');const s={id:uid('school'),name,profile:clone(profileBase),courses:[]};state.schools.push(s);state.ui.schoolId=s.id;state.ui.courseId=null}save();closeModal();render();toast('Escuela guardada')}else if(a==='save-course'){const s=school(),name=document.getElementById('modalCourseName').value.trim(),level=document.getElementById('modalCourseLevel').value,subject=document.getElementById('modalCourseSubject').value.trim(),id=el.dataset.id;if(!name)return toast('Escribí el nombre del curso');if(id){const c=s.courses.find(x=>x.id===id);snap('Editar curso');Object.assign(c,{name,level,subject})}else{snap('Agregar curso');const type=document.getElementById('modalPeriodType').value,periods=makePeriods(type),c={id:uid('course'),name,level,subject,periods,students:[],periodData:{},profileOverrideEnabled:false,profileOverride:clone(s.profile)};s.courses.push(c);state.ui.courseId=c.id;state.ui.periodId=periods[0]?.id||null}save();closeModal();render();toast('Curso guardado')}else if(a==='save-period'){const c=course(),name=document.getElementById('modalPeriodName').value.trim(),id=el.dataset.id;if(!name)return toast('Escribí el nombre del período');if(id){snap('Editar período');c.periods.find(x=>x.id===id).name=name}else{snap('Agregar período');const p={id:uid('period'),name};c.periods.push(p);state.ui.periodId=p.id}save();closeModal();render();toast('Período guardado')}else if(a==='save-student'){const c=course(),name=document.getElementById('modalStudentName').value.trim(),id=el.dataset.id;if(!name)return toast('Escribí el nombre del alumno');if(c.students.some(x=>x.id!==id&&x.name.toLocaleLowerCase('es')===name.toLocaleLowerCase('es')))return toast('Ese alumno ya existe en este curso');snap('Editar alumno');c.students.find(x=>x.id===id).name=name;save();closeModal();render();toast('Alumno actualizado')}else if(a==='select-school'){state.ui.schoolId=el.dataset.id;state.ui.courseId=null;state.ui.periodId=null;state.ui.studentId=null;save();render()}else if(a==='select-course'){state.ui.courseId=el.dataset.id;state.ui.periodId=null;state.ui.studentId=null;save();render()}else if(a==='move-period'){const c=course(),i=c.periods.findIndex(x=>x.id===el.dataset.id),j=i+Number(el.dataset.dir);if(i>=0&&j>=0&&j<c.periods.length){snap('Reordenar período');[c.periods[i],c.periods[j]]=[c.periods[j],c.periods[i]];save();render()}}else if(a==='confirm-delete')deleteModal(el.dataset.kind,el.dataset.id);else if(a==='delete-confirmed'){const kind=el.dataset.kind,id=el.dataset.id,s=school(),c=course();snap('Eliminar '+kind);if(kind==='school'){state.schools=state.schools.filter(x=>x.id!==id);state.ui.schoolId=null}else if(kind==='course'){s.courses=s.courses.filter(x=>x.id!==id);state.ui.courseId=null}else if(kind==='period'){c.periods=c.periods.filter(x=>x.id!==id);delete c.periodData[id];state.ui.periodId=null}else if(kind==='student'){c.students=c.students.filter(x=>x.id!==id);Object.values(c.periodData).forEach(m=>delete m[id]);state.ui.studentId=null}save();closeModal();render();toast('Elemento eliminado · Deshacer')}else if(a==='add-student'){const c=course(),inp=document.getElementById('singleStudent'),name=inp.value.trim();if(!name)return toast('Escribí un nombre');if(c.students.some(x=>x.name.toLocaleLowerCase('es')===name.toLocaleLowerCase('es')))return toast('Ese alumno ya existe en este curso');snap('Agregar alumno');c.students.push({id:uid('student'),name});save();render();toast('Alumno agregado correctamente')}else if(a==='preview-bulk'){const c=course(),txt=document.getElementById('bulkStudents').value,names=parseNames(txt,c),box=document.getElementById('bulkPreview');if(!names.length){box.innerHTML='<p class="muted">No encontré alumnos para agregar. Pegá un nombre por línea.</p>';return}box.innerHTML=`<div class="preview"><strong>Se detectaron ${names.length} alumnos</strong><div class="small" style="margin-top:8px">${names.map(esc).join('<br>')}</div></div><div class="row" style="margin-top:8px"><button class="btn" data-action="cancel-bulk">CANCELAR</button><button class="btn primary" data-action="confirm-bulk">AGREGAR ${names.length} ALUMNOS</button></div>`;box.dataset.names=JSON.stringify(names)}else if(a==='cancel-bulk'){document.getElementById('bulkPreview').innerHTML=''}else if(a==='confirm-bulk'){const c=course(),box=document.getElementById('bulkPreview'),names=JSON.parse(box.dataset.names||'[]');if(!names.length)return;snap('Agregar alumnos');names.forEach(name=>c.students.push({id:uid('student'),name}));save();render();toast(`${names.length} alumnos agregados correctamente`)}else if(a==='toggle-override'){const c=course(),s=school();snap('Cambiar perfil del curso');c.profileOverrideEnabled=el.checked;if(c.profileOverrideEnabled)c.profileOverride=clone(c.profileOverride||s.profile);save();render()}else if(a==='analyze-style'){const txt=document.getElementById('styleSamples').value.trim();if(!txt)return toast('Pegá comentarios para analizar');const res=analyze(txt),box=document.getElementById('styleResult');box.innerHTML=`<div class="preview" style="margin-top:10px"><strong>PERFIL DETECTADO</strong><br>Idioma: ${res.language} · Persona: ${res.person} · Tono: ${res.tone} · Formalidad: ${res.formality} · Extensión: ${res.length}</div><div class="row" style="margin-top:8px"><button class="btn primary" data-action="use-style">USAR ESTE ESTILO</button></div>`;box.dataset.profile=JSON.stringify(res)}else if(a==='use-style'){const s=school(),c=course(),box=document.getElementById('styleResult'),res=JSON.parse(box.dataset.profile||'{}'),txt=document.getElementById('styleSamples').value,t=c?.profileOverrideEnabled?c.profileOverride:s.profile;snap('Usar estilo detectado');Object.assign(t,res,{learned:txt});save();render();toast('Perfil actualizado')}else if(a==='select-student'){state.ui.studentId=el.dataset.id;save();render()}else if(a==='generate-comment'){const c=course(),p=period(),st=student(),d=pdata(c,st.id,p.id);snap('Generar comentario');d.comment=generateComment(c,p,st,d,0);d.manual=false;save();render();toast('Comentario generado')}else if(a==='another-version'){const c=course(),p=period(),st=student(),d=pdata(c,st.id,p.id);snap('Otra versión');d.comment=generateComment(c,p,st,d,1+Math.floor(Math.random()*3));d.manual=false;save();render()}else if(a==='shorter'){const c=course(),p=period(),st=student(),d=pdata(c,st.id,p.id);if(!d.comment)return;snap('Acortar comentario');d.comment=shorten(d.comment);d.manual=false;save();render()}else if(a==='copy-comment'){const c=course(),p=period(),st=student(),txt=pdata(c,st.id,p.id).comment||'';copyText(txt).then(ok=>ok?toast('Comentario copiado'):showCopyFallback(txt)).catch(()=>showCopyFallback(txt))}else if(a==='generate-all'){const c=course(),p=period();snap('Generar todos');let n=0;c.students.forEach((st,i)=>{const d=pdata(c,st.id,p.id);if(!d.comment){d.comment=generateComment(c,p,st,d,i%4);d.manual=false;n++}});save();render();toast(`${n} comentarios generados`)}else if(a==='review-similar'){const c=course(),p=period(),list=c.students.map(st=>({name:st.name,text:pdata(c,st.id,p.id).comment})).filter(x=>x.text),pairs=[];for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++)if(sim(list[i].text,list[j].text)>.68)pairs.push(`${list[i].name} ↔ ${list[j].name}`);openModal(`<h3>Revisión de similitudes</h3>${pairs.length?`<div class="danger-box">${pairs.map(esc).join('<br>')}</div>`:'<p class="success">No detecté similitudes excesivas.</p>'}<div class="modal-footer"><button class="btn" data-action="close-modal">CERRAR</button></div>`)}else if(a==='open-student-comment'){state.ui.studentId=el.dataset.id;state.ui.view='comentarios';save();render()}else if(a==='copy-group-comment'){const c=course(),p=period(),txt=pdata(c,el.dataset.id,p.id).comment||'';copyText(txt).then(ok=>ok?toast('Comentario copiado'):showCopyFallback(txt)).catch(()=>showCopyFallback(txt))}else if(a==='generate-group-comment'){const c=course(),p=period(),st=c.students.find(x=>x.id===el.dataset.id);if(!st)return;const d=pdata(c,st.id,p.id);snap('Generar comentario');d.comment=generateComment(c,p,st,d,c.students.indexOf(st)%4);d.manual=false;save();render();toast('Comentario generado')}else if(a==='regenerate-group-comment'){const c=course(),p=period(),st=c.students.find(x=>x.id===el.dataset.id);if(!st)return;const d=pdata(c,st.id,p.id);snap('Otra versión');d.comment=generateComment(c,p,st,d,1+Math.floor(Math.random()*3));d.manual=false;save();render()}else if(a==='export-docx')exportDOCX();else if(a==='export-xlsx')exportXLSX();else if(a==='copy-all'){const c=course(),p=period(),txt=c.students.map(st=>`${st.name}\n${pdata(c,st.id,p.id).comment||''}`).join('\n\n');copyText(txt).then(ok=>ok?toast('Comentarios copiados'):showCopyFallback(txt)).catch(()=>showCopyFallback(txt))}})
document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const imported=normalize(JSON.parse(r.result));snap('Importar datos');const undoState=state.undo;state=imported;state.demoMode=false;state.undo=undoState;try{localStorage.setItem(DEMO_DISMISSED_KEY,'1')}catch(err){}save();render();toast('Datos importados correctamente')}catch(err){toast('No pude leer este archivo JSON')}};r.readAsText(f);e.target.value=''})
render();
})();
